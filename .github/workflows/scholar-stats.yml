name: Update Google Scholar stats

on:
  schedule:
    # Daily at 03:17 UTC — offset from the hour to avoid GitHub's cron rush.
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch Google Scholar stats
        run: python scripts/fetch_scholar_stats.py

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- scholar-stats.json README.md; then
            git add scholar-stats.json README.md
            git commit -m "Update Google Scholar stats"
            git push
          else
            echo "No change in scholar-stats.json or README.md"
          fi
